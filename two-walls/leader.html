<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leader remote — Two Walls</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#131A22">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23131A22%27/%3E%3Crect x=%276%27 y=%278%27 width=%278%27 height=%2716%27 fill=%27%23F2A93B%27/%3E%3Crect x=%2718%27 y=%278%27 width=%278%27 height=%2716%27 fill=%27%236BA8CB%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/phone.css">
<style>
  main{padding-bottom:40px}
  .card{border:1px solid var(--line);border-radius:3px;padding:16px 16px 18px;margin:0 0 14px}
  .card h3{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate);margin:0 0 12px;font-weight:600}
  .stagenow{font-family:var(--serif);font-weight:300;font-size:26px;margin:0 0 4px;color:var(--sun)}
  .navrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
  .stats .n{font-family:var(--serif);font-weight:300;font-size:32px;line-height:1;color:var(--chalk)}
  .stats .l{font-size:10.5px;color:var(--slate);line-height:1.3;margin-top:4px}
  .list{display:grid;gap:9px}
  .li{border-left:2px solid var(--sun);padding:8px 0 8px 12px;font-size:14.5px;line-height:1.5}
  .li .who{font-size:11px;color:var(--slate);display:block;margin-bottom:3px}
  .tally .row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
  .tally .row:last-child{border-bottom:0}
  .tally .lbl{font-size:14px;line-height:1.35}
  .tally .track{position:relative;height:7px;background:rgba(236,230,217,.08);margin-top:7px;overflow:hidden}
  .tally .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--sun);transition:width .3s}
  .tally .ghost{position:absolute;inset:0 auto 0 0;width:0;background:rgba(236,230,217,.2)}
  .tally .ctr{display:flex;align-items:center;gap:9px}
  .tally .ctr button{width:34px;height:34px;font-size:18px;line-height:1;border:1px solid var(--line);background:none;color:var(--chalk);border-radius:2px;cursor:pointer}
  .tally .ctr .n{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}
  .roundtabs{display:flex;gap:8px;margin-bottom:12px}
  .roundtabs button{flex:1;border:1px solid var(--line);background:none;color:var(--slate);font-family:var(--sans);font-size:13px;padding:9px;border-radius:2px;cursor:pointer}
  .roundtabs button[aria-pressed="true"]{border-color:var(--sun);color:var(--sun)}
  .verdictline{margin-top:14px;font-size:14px;line-height:1.55;color:var(--sun)}
  .warn{font-size:13px;color:var(--sun);line-height:1.5;margin:0 0 12px}
</style>
</head>
<body>

<header id="top">
  <span class="me">
    <span>
      <span class="alias">Leader remote</span><br>
      <span class="sub" id="roomsub">—</span>
    </span>
  </span>
  <span id="conn"><span class="pip"></span><span class="label">…</span></span>
</header>

<main id="view">
  <div class="hold"><p class="glyph">·</p><h2>One moment</h2></div>
</main>

<script type="module" src="js/leader.js"></script>
</body>
</html>
