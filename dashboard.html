<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Presenter Dashboard — AI, Faith &amp; the Future</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body class="dashboard">

<div id="gate" class="dash-gate">
  <div class="gate-panel">
    <h2>Presenter access</h2>
    <p>Enter the passcode to view live responses.</p>
    <form id="gate-form">
      <input id="gate-input" type="password" placeholder="Enter passcode" autocomplete="off">
      <button type="submit">Unlock dashboard</button>
      <div id="gate-err" aria-live="polite"></div>
    </form>
  </div>
</div>

<div class="dash-wrap">
  <div class="dash-header">
    <h1>Live Results</h1>
    <div class="dash-actions">
      <button id="clear-session-btn" type="button" class="clear-session-btn">Clear session</button>
      <span id="status-pill" class="status-pill"><span class="dotlive"></span><span class="label">Checking…</span></span>
    </div>
  </div>
  <div class="dash-sub"><span id="respondent-count">0 respondents so far</span> · updates in real time</div>

  <div id="blocks"></div>
</div>

<script type="module" src="dashboard.js"></script>
</body>
</html>
